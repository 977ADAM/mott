# Шаблоны инструкций для конструктора датасета (scripts/build_dataset.py).
#
# ВАЖНО: чеченские формулировки должен дать НОСИТЕЛЬ. Агент их не сочиняет —
# см. AGENTS.md, «Весь чеченский текст в датасетах финализирует носитель».
# Пока поле содержит "FILL_ME", конструктор с --lang ce откажется работать.
#
# Для v0.1 рабочий вариант — русские формулировки (--lang ru): носитель может
# вычитать их сам, а модель всё равно учится отвечать на чеченском.

# Системное сообщение (необязательно). Должно быть ПЕРВЫМ в messages.
# null = не добавлять системное сообщение вообще.
system:
  ru: null
  ce: FILL_ME

translate_ru_ce:
  ru: "Переведи на чеченский: {text}"
  ce: FILL_ME

translate_ce_ru:
  ru: "Переведи на русский: {text}"
  ce: FILL_ME

# Задача «перевод термина» — для топонимов, имён, официальной лексики.
translate_term_ru_ce:
  ru: "Как это будет по-чеченски: {text}"
  ce: FILL_ME

translate_term_ce_ru:
  ru: "Что это значит по-русски: {text}"
  ce: FILL_ME
